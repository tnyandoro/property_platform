name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bundle exec brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bundle exec bundler-audit check --config config/bundler-audit.yml

  lint:
    runs-on: ubuntu-24.04
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bundle exec rubocop -f simple app/controllers/api/v1/application_controller.rb app/controllers/api/v1/organization_memberships_controller.rb app/controllers/api/v1/sessions_controller.rb app/controllers/api/v1/tenant/dashboard_controller.rb app/controllers/concerns/authentication.rb app/controllers/concerns/property_authorization.rb app/controllers/concerns/property_manager_authorization.rb app/controllers/sessions_controller.rb app/models/current.rb app/models/document.rb app/models/lease_extension_request.rb app/models/lease_renewal_proposal.rb app/models/maintenance_cost_allocation.rb app/models/maintenance_financial_entry.rb app/models/maintenance_request.rb app/models/maintenance_request_update.rb app/models/maintenance_schedule.rb app/models/organization.rb app/models/organization_membership.rb app/models/party_account.rb app/models/property_assignment.rb app/models/property_ownership.rb app/models/property_photo.rb app/models/tenant_invitation.rb app/models/user.rb app/policies/application_policy.rb app/policies/inspection_photo_policy.rb app/policies/inspection_policy.rb app/policies/maintenance_request_policy.rb app/policies/maintenance_schedule_policy.rb app/policies/property_policy.rb db/migrate/20261117000000_create_organization_memberships.rb db/migrate/20261117000100_make_user_organization_optional.rb test/models/auditable_test.rb test/models/maintenance_domain_test.rb test/models/organization_membership_test.rb test/models/tenant_identity_test.rb test/models/tenant_invitation_test.rb test/models/user_test.rb test/requests/authentication_test.rb test/requests/maintenance_requests_test.rb test/requests/organization_memberships_test.rb test/requests/ownership_test.rb test/requests/tenant_dashboard_test.rb

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: property_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d property_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/property_platform_test
      SEED_USER_PASSWORD: estate360-ci-seed-password
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"
          bundler-cache: true

      - name: Run organization membership tests
        run: bundle exec rails db:prepare && bundle exec rails test test/models/organization_membership_test.rb

      - name: Run full Rails regression suite
        run: bundle exec rails test

      - name: Verify development seeds are repeatable
        env:
          SEED_USER_PASSWORD: estate360-ci-seed-password
        run: |
          bundle exec rails db:seed
          bundle exec rails db:seed
